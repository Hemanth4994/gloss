# Gloss evaluation questions: 60 in total, 30 dev and 30 test.
#
# dev  : used to build and tune the agent, the prompts and the retrieval settings.
# test : frozen before the agent is ever run on it (git tag frozen-v1). Run once per configuration.
#
# Fields
#   kind      definition | join | control | unanswerable
#   needs     rule: and metric: chunk ids a correct answer depends on (used only to score retrieval)
#   traps     mutations that must change the gold result: test, tz, status, refund. tests/test_eval_set.py proves they do,
#             so a question cannot quietly be answerable without the definition it claims to need.
#   anti      controls only: a query that wrongly applies a rule. It must NOT reproduce the gold result.
#   ordered   true if row order matters (top-N questions)
#   places    decimals compared for non-integer numbers (default 2). Integers always match exactly.
#   gold      reference SQL with macros, see gloss/evaluation.py. The agent never sees it.
#
# These questions and the dictionary were written by the same author, so this set measures whether the agent USES supplied
# definitions correctly. It does not measure whether it could discover a company's conventions on its own.

# ======================================================== definition questions: dev

- id: d01
  split: dev
  kind: definition
  question: What was net revenue in August 2026?
  needs: [metric:net_revenue, rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz, status, refund]
  gold: |
    WITH {ITEM_TOTALS}, {REFUND_TOTALS}
    SELECT SUM({NET_VALUE}) AS net_revenue
    {NET_FROM}
    WHERE {COMPLETED} AND {REAL} AND {IST_RANGE 2026-08-01 2026-08-31}

- id: d02
  split: dev
  kind: definition
  question: What is our average order value (AOV), to 2 decimals?
  needs: [metric:aov, rule:order_status, rule:test_accounts]
  traps: [test, status]
  gold: |
    WITH {ITEM_TOTALS}
    SELECT SUM(i.items_total - o.discount_amount) * 1.0 / COUNT(*) AS aov
    {ITEMS_FROM}
    WHERE {COMPLETED} AND {REAL}

- id: d03
  split: dev
  kind: definition
  question: How many active customers do we have today?
  needs: [metric:active_customer, rule:as_of_date, rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz, status]
  gold: |
    SELECT COUNT(DISTINCT o.customer_id) AS active_customers
    {ORDERS_C}
    WHERE {COMPLETED} AND {REAL} AND {IST_RANGE 2026-07-03 2026-09-30}

- id: d04
  split: dev
  kind: definition
  question: How many new customers did we get in July 2026?
  needs: [metric:new_customer, rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz, status]
  gold: |
    WITH {FIRST_ORDERS}
    SELECT COUNT(*) AS new_customers FROM first_orders
    WHERE first_day BETWEEN DATE '2026-07-01' AND DATE '2026-07-31'

- id: d05
  split: dev
  kind: definition
  question: >
    What is the cancellation rate for this year so far? Give it as a fraction between 0 and 1, rounded to 4 decimals.
  needs: [metric:cancellation_rate, rule:relative_periods, rule:order_status]
  traps: [status]
  places: 4
  gold: |
    SELECT SUM(CASE WHEN o.status = 'cancelled' THEN 1 ELSE 0 END) * 1.0 / COUNT(*) AS cancellation_rate
    {ORDERS_C}
    WHERE {REAL} AND {DECIDED} AND {IST_RANGE 2026-01-01 2026-09-30}

- id: d06
  split: dev
  kind: definition
  question: What was GMV last month?
  needs: [metric:gmv, rule:relative_periods, rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz, status]
  gold: |
    SELECT SUM(oi.quantity * oi.unit_price) AS gmv
    {GMV_FROM}
    WHERE {REAL} AND {NOT_CANCELLED} AND {IST_RANGE 2026-08-01 2026-08-31}

- id: d07
  split: dev
  kind: definition
  question: How many orders were placed on 15 August 2026?
  needs: [rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz]
  gold: |
    SELECT COUNT(*) AS orders
    {ORDERS_C}
    WHERE {REAL} AND {IST_RANGE 2026-08-15 2026-08-15}

- id: d08
  split: dev
  kind: definition
  question: How many orders are still pending?
  needs: [rule:order_status, rule:test_accounts]
  traps: [test]
  gold: |
    SELECT COUNT(*) AS pending_orders
    {ORDERS_C}
    WHERE {REAL} AND o.status = 'pending'

- id: d09
  split: dev
  kind: definition
  question: How many repeat customers do we have?
  needs: [metric:repeat_customer, rule:test_accounts]
  traps: [test, status]
  gold: |
    SELECT COUNT(*) AS repeat_customers FROM (
      SELECT o.customer_id {ORDERS_C}
      WHERE {COMPLETED} AND {REAL}
      GROUP BY o.customer_id HAVING COUNT(*) >= 2
    )

- id: d10
  split: dev
  kind: definition
  question: Who are our top 5 customers by lifetime value? Return the customer id and the value.
  needs: [metric:customer_ltv, rule:test_accounts]
  traps: [test, status]
  ordered: true
  gold: |
    WITH {ITEM_TOTALS}, {REFUND_TOTALS},
    ltv AS (SELECT o.customer_id, SUM({NET_VALUE}) AS ltv {NET_FROM} WHERE {COMPLETED} AND {REAL} GROUP BY o.customer_id)
    SELECT customer_id, ltv FROM ltv ORDER BY ltv DESC, customer_id LIMIT 5

- id: d11
  split: dev
  kind: definition
  question: What was net revenue over the last 7 days?
  needs: [metric:net_revenue, rule:relative_periods, rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz, status, refund]
  gold: |
    WITH {ITEM_TOTALS}, {REFUND_TOTALS}
    SELECT SUM({NET_VALUE}) AS net_revenue
    {NET_FROM}
    WHERE {COMPLETED} AND {REAL} AND {IST_RANGE 2026-09-24 2026-09-30}

- id: d12
  split: dev
  kind: definition
  question: >
    What was the return rate in August 2026? Give it as a fraction between 0 and 1, rounded to 4 decimals.
  needs: [metric:return_rate, rule:order_status, rule:reporting_timezone]
  traps: [tz]
  places: 4
