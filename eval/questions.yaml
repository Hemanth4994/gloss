# ======================================================== join questions: dev

- id: j01
  split: dev
  kind: join
  question: Which city had the highest net revenue? Return the city and its net revenue.
  needs: [metric:net_revenue, rule:test_accounts]
  traps: [test, status, refund]
  ordered: true
  gold: |
    WITH {ITEM_TOTALS}, {REFUND_TOTALS}
    SELECT c.city, SUM({NET_VALUE}) AS net_revenue
    {NET_FROM}
    WHERE {COMPLETED} AND {REAL}
    GROUP BY c.city ORDER BY net_revenue DESC, c.city LIMIT 1

- id: j02
  split: dev
  kind: join
  question: What is GMV for each acquisition channel? Return the channel and its GMV.
  needs: [metric:gmv, rule:test_accounts]
  traps: [test, status]
  gold: |
    SELECT c.acquisition_channel, SUM(oi.quantity * oi.unit_price) AS gmv
    {GMV_FROM}
    WHERE {REAL} AND {NOT_CANCELLED}
    GROUP BY c.acquisition_channel

- id: j03
  split: dev
  kind: join
  question: What was GMV for each product category in July 2026? Return the category and its GMV.
  needs: [metric:gmv, rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz, status]
  gold: |
    SELECT oi.category, SUM(oi.quantity * oi.unit_price) AS gmv
    {GMV_FROM}
    WHERE {REAL} AND {NOT_CANCELLED} AND {IST_RANGE 2026-07-01 2026-07-31}
    GROUP BY oi.category

- id: j04
  split: dev
  kind: join
  question: >
    How many new customers did we get in each month of 2026? Return the first day of the month as a date and the count,
    ordered by month.
  needs: [metric:new_customer, rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz, status]
  ordered: true
  gold: |
    WITH {FIRST_ORDERS}
    SELECT CAST(DATE_TRUNC('month', first_day) AS DATE) AS month, COUNT(*) AS new_customers
    FROM first_orders WHERE first_day >= DATE '2026-01-01'
    GROUP BY 1 ORDER BY 1

- id: j05
  split: dev
  kind: join
  question: >
    What is the cancellation rate for cash-on-delivery orders? Give it as a fraction between 0 and 1, rounded to 4 decimals.
  needs: [metric:cancellation_rate, rule:order_status, rule:test_accounts]
  traps: [test, status]
  places: 4
  gold: |
    SELECT SUM(CASE WHEN o.status = 'cancelled' THEN 1 ELSE 0 END) * 1.0 / COUNT(*) AS cancellation_rate
    {ORDERS_C}
    WHERE {REAL} AND o.payment_method = 'cod' AND {DECIDED}

- id: j06
  split: dev
  kind: join
  question: How many customers have never had a completed order?
  needs: [rule:test_accounts]
  traps: [test, status]
  gold: |
    SELECT COUNT(*) AS customers FROM customers c
    WHERE {REAL} AND NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND {COMPLETED})

- id: j07
  split: dev
  kind: join
  question: What is the total amount refunded on completed orders?
  needs: [rule:test_accounts]
  traps: [test, status]
  gold: |
    SELECT SUM(r.refund_amount) AS refunded
    FROM refunds r JOIN orders o ON o.order_id = r.order_id JOIN customers c ON c.customer_id = o.customer_id
    WHERE {COMPLETED} AND {REAL}

- id: j08
  split: dev
  kind: join
  question: Which 3 cities have the most repeat customers? Return the city and the number of repeat customers.
  needs: [metric:repeat_customer, rule:test_accounts]
  traps: [test, status]
  ordered: true
  gold: |
    WITH per AS (SELECT o.customer_id, c.city, COUNT(*) AS n {ORDERS_C} WHERE {COMPLETED} AND {REAL} GROUP BY o.customer_id, c.city HAVING COUNT(*) >= 2)
    SELECT city, COUNT(*) AS repeat_customers FROM per GROUP BY city ORDER BY repeat_customers DESC, city LIMIT 3

