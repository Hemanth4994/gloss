# ======================================================== unanswerable: dev
# The data has no column that could answer these. The correct behaviour is to say so and not to invent a proxy.

- id: u01
  split: dev
  kind: unanswerable
  question: What is our profit margin by product category?
  why: There is no cost, cost of goods or margin data, only selling prices.
  missing: [cost, margin, profit]

- id: u02
  split: dev
  kind: unanswerable
  question: What is the average delivery time in days?
  why: Orders have only a placed time and a status, no shipped or delivered timestamp.
  missing: [delivery, delivered, shipped]

- id: u03
  split: dev
  kind: unanswerable
  question: What share of our customers are women?
  why: Customers have no gender field.
  missing: [gender, sex]

- id: u04
  split: dev
  kind: unanswerable
  question: What are the most common reasons customers give for returning an order?
  why: Returns are recorded as a status and a refund, with no reason.
  missing: [reason]

- id: u05
  split: dev
  kind: unanswerable
  question: What is our average customer satisfaction score?
  why: There are no ratings, reviews or survey scores.
  missing: [satisfaction, rating, review, score]

