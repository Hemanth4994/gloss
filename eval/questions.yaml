    GROUP BY 1 ORDER BY 1

# ======================================================== controls: dev
# Raw table questions that need no definition. Where a rule would tempt an agent to filter, the question says "no filters",
# so a rule applied by reflex gives the wrong answer (see `anti`).

- id: c01
  split: dev
  kind: control
  question: How many rows does the orders table contain? Count every row, no filters.
  anti: |
    SELECT COUNT(*) FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE {REAL}
  gold: SELECT COUNT(*) AS n FROM orders

- id: c02
  split: dev
  kind: control
  question: How many distinct city values are there in the customers table?
  gold: SELECT COUNT(DISTINCT city) AS n FROM customers

- id: c03
  split: dev
  kind: control
  question: What is the highest unit_price in the order_items table?
  gold: SELECT MAX(unit_price) AS max_price FROM order_items

- id: c04
  split: dev
  kind: control
  question: How many customers are flagged with is_test = true?
  gold: SELECT COUNT(*) AS n FROM customers WHERE is_test

- id: c05
  split: dev
  kind: control
  question: How many rows does the refunds table contain? Count every row, no filters.
  anti: |
    SELECT COUNT(*) FROM refunds r JOIN orders o ON o.order_id = r.order_id JOIN customers c ON c.customer_id = o.customer_id WHERE {REAL}
  gold: SELECT COUNT(*) AS n FROM refunds

