  needs: [metric:new_customer, rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz, status]
  gold: |
    WITH {FIRST_ORDERS}
    SELECT AVG(DATEDIFF('day', signup_day, first_day)) AS avg_days FROM first_orders

