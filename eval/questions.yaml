- id: j16
  split: test
  kind: join
  question: >
    What was GMV in each month of 2026? Return the first day of the month as a date and the GMV, ordered by month.
  needs: [metric:gmv, rule:reporting_timezone, rule:test_accounts]
  traps: [test, tz, status]
  ordered: true
  gold: |
