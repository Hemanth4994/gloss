name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with every extra the tests use
        run: pip install -e ".[agent,app]" pytest
      - name: "Run the tests (no API key and no network needed; the model is a stand-in)"
        env:
          PYTHONPATH: src:tests
        run: python -m pytest -q analysis tests
